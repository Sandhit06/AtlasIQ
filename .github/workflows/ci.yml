name: Platform checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src apps/api apps/worker
      - run: uv run --locked pytest -m 'not integration' -q
      - run: uv run --locked python scripts/export_openapi.py
      - run: git diff --exit-code -- docs/openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/openapi.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 300
      - run: docker compose --profile test run --build --rm test
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop ephemeral CI stack
        if: always()
        run: docker compose down --volumes
